<!DOCTYPE html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>uEforth Drum machine</title>
<!--
  Drum machine written once with the sdl2 short words: the very same file,
  examples/sdl2_drums.fs, also runs on Linux with SDL2.
  Everything can be done with the mouse: click or drag on the grid to switch
  steps, buttons for play/stop, tempo (left click 1 bpm, right click 5), clear
  and quit, colored pads to play the drums. Keys: space, up/down, 1 2 3 4, c, Esc. The sound starts after
  your first key press or click.
  The Forth file is fetched with XMLHttpRequest, so serve this directory
  over http, for example: python3 -m http.server
-->
<style>
  body { background: #101830; color: #fff; font-family: sans-serif; }
  #again { position: fixed; inset: 0; display: none; align-items: center;
           justify-content: center; flex-direction: column; gap: 1em;
           z-index: 200000; background: #101830; color: #fff; }
  #again button { font-size: 1.5em; padding: 0.5em 1.5em; cursor: pointer; }
</style>
<div id="again">
  <div>Drum machine closed.</div>
  <button onclick="location.reload()">Start again</button>
</div>
<script>
  // Show "Start again" when the game closes its screen (Esc). The Forth
  // interpreter stops there because the game file ends with bye.
  (function() {
    var was = false;
    setInterval(function() {
      var s = window.ueforth && window.ueforth.sdl;
      var open = !!(s && s.open);
      if (was && !open) { document.getElementById('again').style.display = 'flex'; }
      was = open;
    }, 300);
  })();
</script>
<script type="text/forth" src="sdl2_drums.fs"></script>
<script src="ueforth.js"></script>
