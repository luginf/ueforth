<!DOCTYPE html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>uEforth Roguelike</title>
<!--
  Roguelike written once with the sdl2 short words and a tile sheet: the very
  same file, examples/sdl2_roguelike.fs, also runs on Linux with SDL2.
  Arrows or w a s d move (walk into a monster to hit it), space waits, a click
  steps toward the clicked tile, Esc quits. The tiles are loaded from
  sdl2_tiles.png, next to this page.
  The Forth file is fetched with XMLHttpRequest, so serve this directory
  over http, for example: python3 -m http.server
-->
<style>
  body { background: #101830; color: #fff; font-family: sans-serif; }
  #again { position: fixed; inset: 0; display: none; align-items: center;
           justify-content: center; flex-direction: column; gap: 1em;
           z-index: 200000; background: #101830; color: #fff; }
  #again button { font-size: 1.5em; padding: 0.5em 1.5em; cursor: pointer; }
</style>
<div id="again">
  <div>Game closed.</div>
  <button onclick="location.reload()">Play again</button>
</div>
<script>
  // Show "Play again" when the game closes its screen (Esc). The Forth
  // interpreter stops there because the game file ends with bye.
  (function() {
    var was = false;
    setInterval(function() {
      var s = window.ueforth && window.ueforth.sdl;
      var open = !!(s && s.open);
      if (was && !open) { document.getElementById('again').style.display = 'flex'; }
      was = open;
    }, 300);
  })();
</script>
<script type="text/forth" src="sdl2_roguelike.fs"></script>
<script src="ueforth.js"></script>
